services:
  - type: web
    name: insane-nights-backend
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: insane-nights-db
          property: connectionString
    postDeployCommand: npx prisma migrate deploy

databases:
  - name: insane-nights-db
    plan: free
    databaseName: insane_nights
    user: insane_nights_user

