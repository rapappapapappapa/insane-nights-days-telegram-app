services:
  - type: web
    name: nox-backend
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nox-db
          property: connectionString
    postDeployCommand: npx prisma migrate deploy

databases:
  - name: nox-db
    plan: free
    databaseName: nox_db
    user: nox_db_user

